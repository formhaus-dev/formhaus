packages:
  - 'packages/*'
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@formhaus/*'
  - body-parser@2.4.0
  - fast-uri@3.1.9
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  esbuild: true
  lefthook: true
  '@bundled-es-modules/glob': false
  style-dictionary: false
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - undici-types@6.21.0
overrides:
  js-cookie@<3.0.7: ^3.0.8
  body-parser@>=2 <2.4.0: ^2.4.0
  fast-uri@>=3 <3.1.9: ^3.1.9
  js-yaml@>=4 <4.3.2: ^4.3.2
auditConfig:
  ignoreGhsas: []
