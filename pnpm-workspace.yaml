packages:
  - 'packages/*'
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@formhaus/*'
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  esbuild: true
  lefthook: true
  '@bundled-es-modules/glob': false
  style-dictionary: false
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - undici-types@6.21.0
auditConfig:
  ignoreGhsas: []
