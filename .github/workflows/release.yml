name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      actions: write
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the release commit
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Run the release from main"; exit 1; }
          git log --first-parent --format='%H %s' HEAD > "$RUNNER_TEMP/history"
          release=""
          while read -r commit subject; do
            case "$subject" in "chore: release"*) ;; *) continue ;; esac
            git diff "$commit^" "$commit" -- 'packages/*/package.json' > "$RUNNER_TEMP/bump"
            if grep -E '^\+\s*"version":' "$RUNNER_TEMP/bump" > /dev/null; then
              release="$commit"
              break
            fi
          done < "$RUNNER_TEMP/history"
          [ -n "$release" ] || { echo "::error::No release commit found"; exit 1; }
          later=$(git diff --name-only "$release" HEAD -- packages/core packages/react packages/vue packages/formhaus packages/mcp \
            ':(exclude,glob)packages/*/__tests__/**' ':(exclude,glob)packages/*/fixtures/conformance/**' \
            ':(exclude,glob)packages/**/*.md' ':(exclude,glob)packages/*/vitest.config.ts')
          [ -z "$later" ] || { echo "::error::Package sources changed after the release commit:"; echo "$later"; exit 1; }
          pending=$(git ls-tree --name-only HEAD .changeset/ | grep '\.md$' | grep -v '^.changeset/README.md$' || true)
          [ -z "$pending" ] || { echo "::error::Changesets are still pending:"; echo "$pending"; exit 1; }
          echo "Releasing $(git log -1 --format='%h %s' "$release")"
          git checkout --detach "$release"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Pick the npm dist-tag
        run: |
          tag=latest
          if [ -f .changeset/pre.json ] && [ "$(jq -r .mode .changeset/pre.json)" = pre ]; then
            tag=$(jq -r .tag .changeset/pre.json)
          fi
          [[ "$tag" =~ ^[a-z]+$ ]] || { echo "::error::Invalid dist-tag $tag"; exit 1; }
          for dir in packages/*/; do
            [ "$(jq -r '.private // false' "$dir/package.json")" = true ] && continue
            version=$(jq -r .version "$dir/package.json")
            case "$version" in *-*) [ "$tag" != latest ] || { echo "::error::$version would publish as latest"; exit 1; } ;; esac
          done
          echo "DIST_TAG=$tag" >> "$GITHUB_ENV"

      - run: pnpm -r publish --access public --no-git-checks --tag "$DIST_TAG"

      - name: Tag and push released versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for dir in packages/*/; do
            [ "$(jq -r '.private // false' "$dir/package.json")" = true ] && continue
            tag="$(jq -r '.name + "@" + .version' "$dir/package.json")"
            git ls-remote --exit-code --tags "$remote" "refs/tags/$tag" >/dev/null && continue
            git tag "$tag"
            git push "$remote" "refs/tags/$tag"
            echo "$tag" >> "$RUNNER_TEMP/new-tags"
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(jq -r .version packages/core/package.json)
          tag="@formhaus/core@$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          commit=$(git rev-parse HEAD)
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found' packages/core/CHANGELOG.md > "$notes"
          grep -q '[^[:space:]]' "$notes" || { echo "::error::No $version section in packages/core/CHANGELOG.md"; exit 1; }
          {
            echo
            echo "Changes in the adapters: [@formhaus/react](https://github.com/$GH_REPO/blob/$commit/packages/react/CHANGELOG.md), [@formhaus/vue](https://github.com/$GH_REPO/blob/$commit/packages/vue/CHANGELOG.md)."
            echo
            echo '```sh'
            echo "npm install @formhaus/core@$version @formhaus/react@$version"
            echo "npm install @formhaus/core@$version @formhaus/vue@$version"
            echo '```'
          } >> "$notes"
          if [ "$DIST_TAG" = latest ]; then
            flags=(--latest)
          else
            flags=(--prerelease --latest=false)
          fi
          gh release create "$tag" --verify-tag --title "Formhaus $version" --notes-file "$notes" "${flags[@]}"

      - name: Start follow-up workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          core=$(jq -r .version packages/core/package.json)
          mcp=$(jq -r .version packages/mcp/package.json)
          touch "$RUNNER_TEMP/new-tags"
          if [ "$DIST_TAG" = latest ] && grep -qx "@formhaus/core@$core" "$RUNNER_TEMP/new-tags"; then
            gh workflow run docs-pins.yml -f version="$core"
          fi
          if [ "$DIST_TAG" = latest ] && grep -qx "@formhaus/mcp@$mcp" "$RUNNER_TEMP/new-tags"; then
            gh workflow run mcp-registry.yml --ref "@formhaus/mcp@$mcp"
          fi
