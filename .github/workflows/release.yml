name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      actions: write
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm -r publish --access public --no-git-checks

      - run: pnpm changeset git-tag

      - name: Push tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --tags

      - name: Start follow-up workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          core=$(jq -r .version packages/core/package.json)
          mcp=$(jq -r .version packages/mcp/package.json)
          if git tag --points-at HEAD | grep -qx "@formhaus/core@$core"; then
            gh workflow run docs-pins.yml -f version="$core"
          fi
          if git tag --points-at HEAD | grep -qx "@formhaus/mcp@$mcp"; then
            gh workflow run mcp-registry.yml --ref "@formhaus/mcp@$mcp"
          fi
