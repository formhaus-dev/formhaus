name: Full checks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm --filter @formhaus/editor-react exec playwright install --with-deps --only-shell chromium firefox webkit

      - run: pnpm test:release

  check-node-22-12:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm lint:packages

      - run: pnpm typecheck

      - run: pnpm check:types
      - run: pnpm check:bundle-size
      - run: pnpm check:require
      - run: pnpm check:es-target
      - run: pnpm api:check

      - run: pnpm --filter @formhaus/core --filter @formhaus/react run test:resolve

      - run: pnpm --filter @formhaus/editor-react exec playwright install --with-deps --only-shell chromium

      - run: pnpm test

  lowest-peers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm --filter @formhaus/react add -D react@18.0.0 react-dom@18.0.0

      - run: pnpm --filter @formhaus/vue add -D vue@3.3.3

      - run: pnpm --filter @formhaus/react --filter @formhaus/vue test

      - run: node scripts/check-consumer-types.mjs
