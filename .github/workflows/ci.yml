name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm lint:packages

      - run: pnpm typecheck

      - run: pnpm check:types
      - run: pnpm check:bundle-size
      - run: pnpm check:source-size
      - run: pnpm check:builder-isolation
      - run: pnpm check:migration
      - run: pnpm templates:check

      - run: pnpm --filter @formhaus/core --filter @formhaus/react run test:resolve

      - run: pnpm --filter @formhaus/editor-react exec playwright install --with-deps --only-shell chromium

      - run: pnpm test

  lowest-peers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @formhaus/react add -D react@18.0.0 react-dom@18.0.0

      - run: pnpm --filter @formhaus/vue add -D vue@3.3.3

      - run: pnpm build

      - run: pnpm --filter @formhaus/react --filter @formhaus/vue test

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: pnpm audit --prod --audit-level high

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm docs:build

      - run: pnpm check:docs-bundle

      - run: pnpm check:seo

      - run: pnpm check:seo:docs

      - run: pnpm --filter @formhaus/editor-react exec playwright install --with-deps --only-shell chromium

      - run: pnpm check:build-page

      - run: pnpm check:editor-guard

  examples:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        example: [react-mui, vue-vuetify, vanilla-svelte, react-quiz, nextjs-app-router, nuxt, react-shadcn, cloud-waitlist/react]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install example deps
        working-directory: examples/${{ matrix.example }}
        run: pnpm install --frozen-lockfile

      - name: Build example
        working-directory: examples/${{ matrix.example }}
        run: pnpm build
