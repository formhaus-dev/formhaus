name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      full: ${{ steps.changes.outputs.full }}
      code: ${{ steps.changes.outputs.code }}
      peers: ${{ steps.changes.outputs.peers }}
      deps: ${{ steps.changes.outputs.deps }}
      docs: ${{ steps.changes.outputs.docs }}
      templates: ${{ steps.changes.outputs.templates }}
      examples: ${{ steps.changes.outputs.examples }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - id: changes
        run: node scripts/ci-affected.mjs changes

  check:
    name: check (${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - node: 22
            node-version: '22.12'
          - node: 24
            node-version: '24'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm lint:packages

      - run: pnpm typecheck

      - run: pnpm check:types
      - run: pnpm check:bundle-size
      - run: pnpm check:duplicates
      - run: pnpm check:source-size
      - run: pnpm docs:install
      - run: pnpm check:knip
      - run: pnpm check:builder-isolation
      - run: pnpm check:migration
      - run: pnpm check:docs-versions
      - run: pnpm check:tokens
      - run: pnpm templates:check

      - run: pnpm --filter @formhaus/core --filter @formhaus/react run test:resolve

      - run: pnpm check:require

      - id: affected
        env:
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          if [ "$FULL" = true ]; then filter='./packages/*'; else filter='...[HEAD^1]'; fi
          if pnpm --filter "$filter" --filter '!{.}' list --depth -1 --json | grep -q '"@formhaus/editor-react"'; then echo 'browsers=true' >> "$GITHUB_OUTPUT"; fi

      - if: steps.affected.outputs.browsers == 'true'
        run: pnpm --filter @formhaus/editor-react exec playwright install --with-deps --only-shell chromium

      - if: needs.changes.outputs.full == 'true'
        run: pnpm test

      - if: needs.changes.outputs.full != 'true'
        run: pnpm --filter '...[HEAD^1]' --filter '!{.}' test

  content:
    needs: changes
    if: needs.changes.outputs.full != 'true' && (needs.changes.outputs.templates == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.examples == 'true')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm --filter @formhaus/core build

      - run: pnpm docs:install
      - run: pnpm check:knip
      - run: pnpm check:docs-versions
      - run: pnpm templates:check

      - run: node scripts/ci-affected.mjs content-tests

  lowest-peers:
    needs: changes
    if: needs.changes.outputs.peers == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @formhaus/react add -D react@18.0.0 react-dom@18.0.0

      - run: pnpm --filter @formhaus/vue add -D vue@3.3.3

      - run: pnpm build

      - run: pnpm --filter @formhaus/react --filter @formhaus/vue test

  audit:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: pnpm audit --prod --audit-level high

  docs:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.templates == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm check:size-docs

      - run: pnpm docs:build

      - run: pnpm check:seo

      - run: pnpm check:template-aliases

  examples:
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        example: [react-mui, vue-vuetify, vanilla-svelte, react-quiz, react-flat-api, nextjs-app-router, nuxt, react-shadcn, cloud-waitlist/react]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install example deps
        working-directory: examples/${{ matrix.example }}
        run: pnpm install --frozen-lockfile

      - name: Build example
        working-directory: examples/${{ matrix.example }}
        run: pnpm build

  ci-ok:
    needs: [changes, check, content, lowest-peers, audit, docs, examples]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
